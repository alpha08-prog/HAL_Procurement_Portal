# Two containers: the Express API (in-memory payment store + SQLite files under
# /app/server/data) and the nginx-served client that proxies /api to it.
# There is no database server: the app's persistent stores are SQLite files, kept in the
# hal_data volume. Uploaded attachments go to hal_uploads.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hal_backend_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-hal_nashik_procurement_secret_2026}
      CONTRACT_ENCRYPTION_KEY: ${CONTRACT_ENCRYPTION_KEY:-}
      STORAGE_PATH: /app/server/uploads
      # Ollama runs on the host in the demo setup; host.docker.internal resolves to it on
      # Docker Desktop. Leave SLM_MODEL empty to use the server default (qwen2.5:3b).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SLM_MODEL: ${SLM_MODEL:-}
      OTP_DEMO_ENDPOINT: ${OTP_DEMO_ENDPOINT:-true}
    volumes:
      - hal_data:/app/server/data
      - hal_uploads:/app/server/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hal_network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: hal_frontend_portal
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server
    networks:
      - hal_network

volumes:
  hal_data:
    driver: local
  hal_uploads:
    driver: local

networks:
  hal_network:
    driver: bridge
